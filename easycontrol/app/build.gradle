plugins {
  id 'com.android.application' version '8.2.2'
}

def envKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def envKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def envKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (!envKeystorePath && keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
  namespace 'top.saymzx.easycontrol.app'
  compileSdk 34

  signingConfigs {
    release {
      if (envKeystorePath) {
        storeFile file(envKeystorePath)
        storePassword envKeystorePassword
        keyAlias envKeyAlias
        keyPassword envKeyPassword
      } else if (keystorePropertiesFile.exists()) {
        storeFile rootProject.file(keystoreProperties.getProperty("storeFile"))
        storePassword keystoreProperties.getProperty("storePassword")
        keyAlias keystoreProperties.getProperty("keyAlias")
        keyPassword keystoreProperties.getProperty("keyPassword")
      }
    }
  }

  defaultConfig {
    applicationId "top.saymzx.easycontrol.app"
    minSdk 21
    targetSdk 34
    versionCode 10507
    // Modified build (GPL-3.0): suffix marks this fork, which ships without activation.
    versionName "1.5.7-free"
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
    }
  }

  viewBinding {
    enabled = true
  }

  buildTypes {
    debug {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
      manifestPlaceholders = [app_name: "@string/app_name_dev", app_icon: "@mipmap/ic_launcher_dev", app_icon_round: "@mipmap/ic_launcher_dev_round"]
      debuggable true
    }
    release {
      buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
      manifestPlaceholders = [app_name: "@string/app_name", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
      debuggable false
      signingConfig signingConfigs.release
      minifyEnabled true
      shrinkResources true
      proguardFiles 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  packagingOptions {
    resources.excludes.add("META-INF/*")
  }

}

dependencies {
}

// The app embeds the server APK as a raw resource. Build and copy it first.
tasks.named("preBuild").configure {
  dependsOn(":server:copyRelease")
}
